services:
  caddy:
    image: caddy:2.7
    container_name: nego-lah-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  backend:
    # Image is built & pushed by CI; the server pulls it (never builds locally).
    # `build` is kept so `docker compose build` still works for local dev.
    image: ghcr.io/terryong31/nego-lah-backend:latest
    build: ./backend
    container_name: nego-lah-backend
    restart: always
    expose:
      - "8000"
    # backend/.env holds the backend's own secrets (Supabase, Stripe, Gemini…).
    # Maintained on the server; gitignored, so CI never overwrites it.
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    # Image is built & pushed by CI; the server pulls it (never builds locally).
    image: ghcr.io/terryong31/nego-lah-frontend:latest
    build: ./frontend
    container_name: nego-lah-frontend
    restart: always
    # Nuxt SSR (Nitro node-server) listens on 3000.
    expose:
      - "3000"
    # frontend/.env holds SUPABASE_URL / SUPABASE_KEY for the Nuxt Supabase module.
    env_file:
      - ./frontend/.env
    environment:
      - NODE_ENV=production
      # Public API base used by the browser; Caddy routes /api/* to the backend.
      # Overrides the build-time default in nuxt.config.ts.
      - NUXT_PUBLIC_API_BASE_URL=https://negolah.my/api
      # @nuxtjs/supabase reads runtimeConfig.public.supabase.{url,key}. The image
      # is built without .env (secrets stay out of the image), so we inject these
      # at runtime via Nuxt's NUXT_PUBLIC_* override. The publishable key is a
      # browser-facing value, so this is not a secret.
      - NUXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL:-https://umtsegjkgpfefjvhyysh.supabase.co}
      - NUXT_PUBLIC_SUPABASE_KEY=${SUPABASE_KEY:-sb_publishable_obtnwe54q7npFVPRcgoxZg_ICdZyo8w}
      # Sentry DSN is not secret (it's shipped to every browser regardless), so
      # it's safe to default here the same way the Supabase publishable key is.
      - NUXT_PUBLIC_SENTRY_DSN=${SENTRY_DSN:-https://3c5f62060fc1a9ef26ef72b6be0ba4b1@o4511643096907776.ingest.us.sentry.io/4511683720970240}
    depends_on:
      backend:
        condition: service_started

  redis:
    image: redis:alpine
    container_name: nego-lah-redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  redis_data:
