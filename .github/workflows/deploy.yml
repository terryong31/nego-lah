name: Deploy to Lightsail

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

# Images are published to GitHub Container Registry (GHCR) under the repo owner.
env:
  BACKEND_IMAGE: ghcr.io/terryong31/nego-lah-backend
  FRONTEND_IMAGE: ghcr.io/terryong31/nego-lah-frontend

jobs:
  # Backend and frontend test suites run as two independent jobs so they
  # execute in parallel on separate runners (previously one sequential job).
  # build-and-push waits for BOTH via `needs`.
  backend-test:
    name: Backend tests (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # matches backend/Dockerfile (python:3.12-slim)
          cache: 'pip'
          # Bust the cache when either the runtime or the dev/test pin set changes.
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint + bandit-equivalent security rules)
        run: |
          cd backend
          ruff check .

      - name: Pytest (with coverage)
        run: |
          cd backend
          pytest

  frontend-test:
    name: Frontend tests (lint + typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Lint & Typecheck
        run: |
          cd frontend
          bun run lint
          bun run typecheck

      - name: Unit tests (Vitest)
        run: |
          cd frontend
          bun run test

  # Build the images on GitHub's runners (plenty of RAM) and push to GHCR, so
  # the 2 GB Lightsail box never has to build (it used to OOM/take ~16 min).
  # The two images build in parallel as separate jobs (they used to build
  # sequentially in one job — the ~3m bottleneck of the ~6m pipeline). Both
  # are gated on BOTH test suites, so a failing test still blocks any push.
  build-backend:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          # org/project aren't secret; the auth token is passed as a BuildKit
          # secret (see frontend/Dockerfile) so it's never written to an image
          # layer or the GHA build cache.
          build-args: |
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Ship only the runtime config to the server, then pull the freshly built
  # images and restart. No source is copied and nothing is built on the server.
  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose + Caddyfile to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: "~/nego-lah"

      - name: Pull images & restart on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_ACTOR,GHCR_TOKEN
          script: |
            cd ~/nego-lah
            # Ephemeral, run-scoped token — valid only for this workflow run.
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker logout ghcr.io
            sudo docker image prune -f   # Clean up dangling images
