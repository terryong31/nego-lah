# Supabase project configuration.
# Docs: https://supabase.com/docs/guides/cli/config
project_id = "nego-lah"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
# Keep the cap aligned with the 2MB avatar limit enforced in the API.
file_size_limit = "50MiB"

[storage.vector]
enabled = false

[storage.buckets.images]
public = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
  "https://negolah.my",
  "https://negolah.my/**",
  "https://www.negolah.my",
  "https://www.negolah.my/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.template.magic_link]
# The code is NOT in the subject on purpose: subject lines show on lock screens,
# get logged in the clear by mail servers, and a preview-and-never-open hurts
# sender reputation. The code is in the email body + preheader (visible in the
# inbox preview), so mobile users still get it at a glance.
subject = "Your Nego-lah verification code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Reset your Nego-lah password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.confirmation]
subject = "Confirm your Nego-lah account"
content_path = "./supabase/templates/confirmation.html"

[analytics]
enabled = false

# --- Remote environment overrides -------------------------------------------
# The [auth] block above is the LOCAL config (used by `supabase start`) and also
# what staging gets. `supabase config push --project-ref <ref>` deep-merges the
# matching [remotes.*] block over it — prod is locked down below.
[remotes.prod]
project_id = "umtsegjkgpfefjvhyysh"

[remotes.prod.auth]
# Production auth never redirects to a dev origin. Only the real domain and its
# www host, plus the wildcard for post-login return paths (/confirm, saved
# redirect cookie, OAuth).
site_url = "https://negolah.my"
additional_redirect_urls = [
  "https://negolah.my",
  "https://negolah.my/**",
  "https://www.negolah.my",
  "https://www.negolah.my/**",
]
