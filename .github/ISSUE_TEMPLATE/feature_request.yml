name: Idea or improvement
description: Suggest a change. Accepted ideas become a spec in docs/specs/.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would change. Rough is fine.
