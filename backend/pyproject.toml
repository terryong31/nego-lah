[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --cov=. --cov-report=term-missing --cov-report=html --cov-report=xml"

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "tests/*",
    ".venv/*",
    "alembic/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",   # line length handled by formatter/line-length setting, not worth failing CI over
    "S101",   # assert is fine (and expected) in test files
    "B008",   # FastAPI's Depends(...) as a default arg is the framework's idiom, not a bug
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]   # asserts + literal test credentials are expected in tests
"scripts/*" = ["S603", "S607"]          # CLI scripts intentionally shell out / use argv
