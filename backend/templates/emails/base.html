<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ subject }}{% endblock %}</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a.btn-primary:visited { color: #ffffff !important; }
    a.btn-primary:hover { background-color: #059669 !important; border-color: #047857 !important; }
  </style>
</head>
<body style="margin: 0; padding: 24px 12px; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #0f172a;">
  <!-- Preheader preview text -->
  <div style="display: none; font-size: 1px; color: #f8fafc; line-height: 1px; max-height: 0px; max-width: 0px; opacity: 0; overflow: hidden; mso-hide: all;">
    {% block preheader %}{% endblock %}
  </div>

  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr>
      <td align="center">
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 540px; background-color: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); overflow: hidden;">
          <!-- Brand Header -->
          <tr>
            <td align="center" style="padding: 32px 32px 20px; border-bottom: 1px solid #f1f5f9;">
              <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="vertical-align: middle;">
                    <img src="{{ brand_logo_url }}" alt="Nego-lah" width="32" height="32" style="display: block; width: 32px; height: 32px; border-radius: 8px; border: 0; object-fit: contain;">
                  </td>
                  <td style="vertical-align: middle; padding-left: 10px;">
                    <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: #09090b;">
                      Nego<span style="color: #10b981;">-lah</span>
                    </span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Content Body -->
          <tr>
            <td style="padding: 32px 32px 28px; text-align: center;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 24px 32px 32px; background-color: #fafafa; border-top: 1px solid #f1f5f9; text-align: center;">
              {% block footer %}
              <p style="margin: 0; font-size: 12px; color: #94a3b8; line-height: 1.5;">
                © Nego-Lah · Autonomous Second-Hand Marketplace with AI Negotiations
              </p>
              {% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
