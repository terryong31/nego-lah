name: Deploy to Lightsail

on:
  push:
    branches: [ main ]

# Images are published to GitHub Container Registry (GHCR) under the repo owner.
env:
  BACKEND_IMAGE: ghcr.io/terryong31/nego-lah-backend
  FRONTEND_IMAGE: ghcr.io/terryong31/nego-lah-frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Backend CI (FastAPI + pytest) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # matches backend/Dockerfile (python:3.12-slim)
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Backend Tests
        run: |
          cd backend
          pytest

      # --- Frontend CI (Nuxt + Bun) ---
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Lint & Typecheck Frontend
        run: |
          cd frontend
          bun run lint
          bun run typecheck

  # Build the images on GitHub's runners (plenty of RAM) and push to GHCR, so
  # the 2 GB Lightsail box never has to build (it used to OOM/take ~16 min).
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Ship only the runtime config to the server, then pull the freshly built
  # images and restart. No source is copied and nothing is built on the server.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose + Caddyfile to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: "~/nego-lah"

      - name: Pull images & restart on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_ACTOR,GHCR_TOKEN
          script: |
            cd ~/nego-lah
            # Ephemeral, run-scoped token — valid only for this workflow run.
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker logout ghcr.io
            sudo docker image prune -f   # Clean up dangling images
