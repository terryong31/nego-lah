name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.claude/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.claude/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BACKEND_IMAGE: ghcr.io/terryong31/nego-lah-backend

# Least privilege by default; jobs that push images widen it themselves.
permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      migrations: ${{ steps.filter.outputs.migrations }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - 'Caddyfile'
              - '.github/workflows/deploy.yml'
            migrations:
              - 'supabase/migrations/**'
            docs:
              - 'docs/**'
              - '*.md'
              - '.markdownlint-cli2.jsonc'
              - '.vale.ini'
              - '.vale/**'
              - 'backend/scripts/docs_tools.py'

  backend-ci:
    name: Backend CI (ruff, pytest, bandit & pip-audit)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Ruff check
        run: |
          cd backend
          uv run ruff check .

      - name: Pytest with coverage
        run: |
          cd backend
          uv run pytest

      - name: Static security analysis (bandit)
        run: |
          cd backend
          uv run bandit -q -r . -x ./tests,./conftest.py,./.venv,./htmlcov,./evals,./scripts

      - name: Dependency vulnerability audit (pip-audit)
        run: |
          cd backend
          uv run pip-audit

  # SPEC-102: Markdown structure, prose, links, generated indexes, ADR metadata,
  # the OpenAPI contract, and an advisory list of living docs older than the
  # code they describe. Runs for docs changes and for backend changes.
  docs-check:
    name: Docs checks
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # docs_tools stale compares commit times

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Markdown lint (living docs; globs in .markdownlint-cli2.jsonc)
        run: npx --yes markdownlint-cli2@0.23.3

      - name: Prose lint (Vale; version pinned in mise.toml, style in .vale/)
        run: |
          VALE=3.24.0
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE}/vale_${VALE}_Linux_64-bit.tar.gz" | tar -xz -C /tmp vale
          /tmp/vale README.md SECURITY.md CONTRIBUTING.md docs/README.md docs/architecture docs/api/README.md docs/data docs/repo docs/workers docs/flows docs/ci-cd docs/security docs/how-to docs/tutorials docs/adr/README.md docs/adr/TEMPLATE.md docs/specs/README.md docs/specs/TEMPLATE.md

      - name: Docs checks
        run: |
          cd backend
          uv run pytest --no-cov -q tests/test_docs.py tests/test_spec_registry.py

      - name: Stale-docs report (advisory, never fails)
        run: |
          cd backend
          uv run python -m scripts.docs_tools stale

  migrations-check:
    name: Validate Supabase migrations
    needs: [changes]
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: the append-only rule is a diff against the merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Deliberately stdlib-only and credential-free. This job runs on pull
      # requests, including from forks, so it must never be able to reach the
      # production database — it reads filenames and a diff, nothing else.
      - name: Validate names, versions and append-only history
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          cd backend
          if git -C .. cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git -C .. diff --name-status "${BASE_SHA}...HEAD" -- supabase/migrations \
              | python scripts/validate_migrations.py --diff-from-stdin
          else
            echo "No resolvable base commit (${BASE_SHA}) — validating the directory only."
            python scripts/validate_migrations.py
          fi

  migrate:
    name: Apply Supabase migrations (production)
    needs: [changes, migrations-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Declared so a required-reviewer rule can be added in repo settings without
    # editing this workflow. With no rules configured it changes nothing.
    environment: production
    # Global, not per-ref: two runs must never apply migrations to one database
    # at the same time, and cancelling one mid-transaction is worse than queueing.
    concurrency:
      group: supabase-migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      # Idempotent: every applied version is recorded in
      # `supabase_migrations.schema_migrations` and skipped on the next run, so a
      # re-run of this job is a no-op rather than a second application.
      - name: Apply pending migrations
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          cd backend
          infisical run --env=prod --path=/Backend -- uv run python scripts/run_migrations.py

  frontend-lint:
    name: Frontend Lint & Typecheck
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Lint
        run: |
          cd frontend
          bun run lint

      - name: Typecheck
        run: |
          cd frontend
          bun run typecheck

      # `bun pm untrusted` only lists blocked lifecycle scripts — it is not a
      # vulnerability scan, so the frontend had no CVE gate at all (audit SUP-1).
      - name: Dependency vulnerability audit (bun audit)
        run: frontend/scripts/audit.sh

  frontend-test:
    name: Frontend Unit Tests (Vitest)
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Unit & i18n tests (Vitest)
        run: |
          cd frontend
          bun run test

  deploy-frontend:
    name: Deploy frontend to Cloudflare Pages
    needs: [changes, frontend-lint, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Generate static SPA with Infisical secrets
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          cd frontend
          infisical run --env=prod --path=/Frontend -- bun run generate

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/.output/public --project-name=nego-lah

  build-backend:
    name: Build & push backend image
    needs: [changes, backend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  deploy-backend:
    name: Deploy backend to Lightsail
    needs: [changes, build-backend, migrate]
    # `always()` because most pushes change no schema, which SKIPS `migrate` —
    # and a skipped dependency would otherwise skip this job too. It also
    # defeats the implicit "all needs succeeded" check, so `build-backend` has
    # to be asserted by hand. A migration that FAILED blocks the deploy: the
    # running code is the version that matches the old schema.
    if: >-
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend == 'true' &&
      needs.build-backend.result == 'success' &&
      needs.migrate.result != 'failure' && needs.migrate.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Export Backend Production Secrets
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          mkdir -p backend
          infisical export --env=prod --path=/Backend --format=dotenv > backend/.env.production
          echo "SENTRY_RELEASE=${{ github.sha }}" >> backend/.env.production

      - name: Copy compose, Caddyfile, and env to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,Caddyfile,backend/.env.production"
          target: "~/nego-lah"

      # Deploy by SHA, not `:latest`, so what runs is what this commit built and
      # a rollback is re-pinning the previous SHA. The job then waits for the
      # container's own healthcheck and, if the new image never comes up, puts
      # the previous one back and fails red (audit DEP-1).
      - name: Pull image, update env & restart on server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_ACTOR,GHCR_TOKEN,IMAGE_TAG
          command_timeout: 10m
          script: |
            set -eu
            cd ~/nego-lah
            mkdir -p backend
            if [ -f backend/.env.production ]; then
              mv backend/.env.production backend/.env
              chmod 600 backend/.env
            fi
            PREV_IMAGE=$(sudo docker inspect -f '{{.Image}}' nego-lah-backend 2>/dev/null || true)
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            sudo env BACKEND_IMAGE_TAG="$IMAGE_TAG" docker compose pull
            sudo env BACKEND_IMAGE_TAG="$IMAGE_TAG" docker compose up -d --remove-orphans
            sudo docker logout ghcr.io
            # `reload` is graceful; a restart drops every open connection, SSE
            # streams included. Fall back to a restart only if reload fails.
            sudo docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile \
              || sudo docker compose restart caddy
            healthy=""
            for _ in $(seq 1 40); do
              status=$(sudo docker inspect -f '{{.State.Health.Status}}' nego-lah-backend 2>/dev/null || echo missing)
              if [ "$status" = "healthy" ]; then healthy=1; break; fi
              sleep 5
            done
            if [ -z "$healthy" ]; then
              echo "::error::backend never became healthy; rolling back"
              sudo docker logs --tail 100 nego-lah-backend || true
              if [ -n "$PREV_IMAGE" ]; then
                sudo docker tag "$PREV_IMAGE" ghcr.io/terryong31/nego-lah-backend:rollback
                sudo env BACKEND_IMAGE_TAG=rollback docker compose up -d backend
              fi
              exit 1
            fi
            sudo docker image prune -f
