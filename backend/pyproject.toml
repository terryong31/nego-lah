[project]
name = "nego-lah-backend"
version = "1.0.0"
description = "FastAPI Modular Monolith backend for Nego-Lah second-hand store"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.30.0",
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.14.3",
    "ddgs>=1.0.0",
    "fastapi>=0.139.0",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.3.13",
    "langchain-community>=0.4.1",
    "langchain-core>=1.4.9",
    "langchain-google-genai>=4.2.1",
    "langchain-openai>=0.3.0",
    "langgraph>=1.2.9",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-json-logger>=4.0.0",
    "python-multipart>=0.0.31",
    "redis>=7.2.0",
    "requests>=2.33.0",
    "rich>=14.3.3",
    "sentry-sdk[fastapi]>=2.64.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.46",
    "stripe>=14.3.0",
    "supabase>=2.28.0",
    "svix>=1.96.1",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.3",
    "pip-audit>=2.10.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --cov=. --cov-report=term-missing --cov-report=html --cov-report=xml"

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "tests/*",
    ".venv/*",
    "alembic/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
# The gate. Coverage was being *collected* and then ignored, which meant it
# could rot a point at a time without anything going red. Set one below the
# current total so ordinary work has headroom but a real regression fails the
# build; raise it when the number climbs. Running a subset of the suite trips
# this by design — use `pytest --no-cov` for that.
fail_under = 88
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",   # line length handled by formatter/line-length setting, not worth failing CI over
    "S101",   # assert is fine (and expected) in test files
    "B008",   # FastAPI's Depends(...) as a default arg is the framework's idiom, not a bug
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]   # asserts + literal test credentials are expected in tests
"scripts/*" = ["S603", "S607"]          # CLI scripts intentionally shell out / use argv
