name: Deploy to Lightsail

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Backend CI (FastAPI + pytest) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # matches backend/Dockerfile (python:3.12-slim)
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Backend Tests
        run: |
          cd backend
          pytest

      # --- Frontend CI (Nuxt + Bun) ---
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile

      - name: Lint & Typecheck Frontend
        run: |
          cd frontend
          bun run lint
          bun run typecheck

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Strip heavy/local-only dirs so the SCP transfer stays small.
      # Deps and build output are regenerated on the server by `docker compose build`.
      - name: Clean up heavy directories before SCP
        run: |
          rm -rf \
            .git \
            dump.rdb \
            frontend/node_modules \
            frontend/.nuxt \
            frontend/.output \
            frontend/.data \
            frontend/.nitro \
            frontend/dist \
            backend/.venv \
            backend/__pycache__ \
            backend/.pytest_cache

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "~/nego-lah"

      - name: Restart Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/nego-lah
            export DOCKER_BUILDKIT=1
            sudo DOCKER_BUILDKIT=1 docker compose build
            sudo docker compose up -d --remove-orphans
            sudo docker image prune -f   # Clean up dangling images
