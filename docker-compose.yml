# SPEC-043 workstream C: all three services share one 2 GB / 1–2 vCPU Lightsail
# box. Without limits Docker lets them compete first-come, so an API spike
# starves the Redis the API itself depends on for auth and rate limiting — and
# every request slows, not just the busy ones. The two sidecars get hard
# ceilings (they're cheap and must stay cheap); the API gets the remaining
# memory and is left CPU-uncapped so it can use whatever is genuinely spare.
services:
  caddy:
    image: caddy:2.7
    container_name: nego-lah-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    cpus: 0.4
    depends_on:
      - backend

  backend:
    # Image is built & pushed by CI; the server pulls it (never builds locally).
    image: ghcr.io/terryong31/nego-lah-backend:latest
    build: ./backend
    container_name: nego-lah-backend
    restart: always
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
      - REDIS_URL=redis://redis:6379/0
      # Pinned rather than inherited: the Dockerfile's fallback is 4, which put
      # four worker processes on a box with one or two cores. Matching the
      # worker count to the cores means less context-switching between workers
      # and more CPU left for the Redis and Caddy sitting beside them.
      - WEB_CONCURRENCY=2
    # The API is the one process that legitimately needs room, so it takes the
    # memory the sidecars don't and stays CPU-uncapped — a ceiling here would
    # idle capacity that nothing else is asking for.
    mem_limit: 1200m
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:alpine
    container_name: nego-lah-redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    # `maxmemory` sits below `mem_limit` on purpose: Redis has to start evicting
    # before the kernel starts killing, or the cap just relocates the crash.
    # `volatile-ttl` suits this keyspace — sessions, rate counters, leases and
    # cached items nearly all carry a TTL already, so eviction drops whatever
    # was closest to expiring anyway rather than guessing.
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "volatile-ttl"]
    mem_limit: 256m
    cpus: 0.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  redis_data:
