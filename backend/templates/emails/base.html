<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{% block title %}{{ subject }}{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    body { margin: 0; padding: 0; width: 100% !important; background-color: #f4f4f2;
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
           -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; line-height: 100%; outline: none; text-decoration: none; }
    a { color: #047857; }
    a.btn-primary:visited { color: #ffffff !important; }
    a.btn-primary:hover { background-color: #059669 !important; border-color: #047857 !important; }
    @media (prefers-color-scheme: dark) {
      body, .eml-bg { background-color: #0a0a0a !important; }
      .eml-card { background-color: #0a0a0a !important; }
      .eml-ink { color: #f2f2f3 !important; }
      .eml-soft { color: #b0b0b6 !important; }
      .eml-muted { color: #82828a !important; }
      .eml-hr { border-color: #232323 !important; }
      .eml-accent { color: #34d399 !important; }
      .eml-danger { color: #f87171 !important; }
      .eml-surface { background-color: #141414 !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f2;">
  <!-- Preheader preview text -->
  <div style="display: none; font-size: 1px; color: #f4f4f2; line-height: 1px; max-height: 0px; max-width: 0px; opacity: 0; overflow: hidden; mso-hide: all;">
    {% block preheader %}{% endblock %}
  </div>

  <table class="eml-bg" role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f4f4f2;">
    <tr>
      <td align="center" style="padding: 40px 16px;">
        <table class="eml-card" role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #f4f4f2;">
          <!-- Brand header -->
          <tr>
            <td class="eml-hr" style="padding: 2px 16px 18px; border-bottom: 1px solid #dededa;">
              <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="vertical-align: middle;">
                    <img src="{{ brand_logo_url }}" alt="Nego-lah" width="24" height="24" style="display: block; width: 24px; height: 24px; border: 0; object-fit: contain;">
                  </td>
                  <td style="vertical-align: middle; padding-left: 9px;">
                    <span class="eml-ink" style="font-size: 15px; font-weight: 800; letter-spacing: -0.02em; color: #1a1a1e;">Nego<span style="color: #10b981;">-lah</span></span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td style="padding: 26px 16px 24px; text-align: left;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="eml-hr" style="padding: 20px 16px 24px; border-top: 1px solid #dededa; text-align: left;">
              {% block footer %}
              <p class="eml-muted" style="margin: 0; font-size: 12px; line-height: 1.6; color: #78787f;">
                Nego-lah &middot; Autonomous second-hand marketplace &middot; <a href="https://negolah.my" target="_blank" class="eml-accent" style="color: #047857; text-decoration: none;">negolah.my</a>
              </p>
              {% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
