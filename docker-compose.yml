# SPEC-043 workstream C: both services share one 2 GB / 1–2 vCPU Lightsail box.
# Without limits Docker lets them compete first-come. Caddy gets a hard ceiling
# (it is cheap and must stay cheap); the API gets the remaining memory and is
# left CPU-uncapped so it can use whatever is genuinely spare. Redis is managed
# (Upstash, via the REDIS_URL secret); the local sidecar was retired 2026-10-07.
# Docker's json-file driver grows without bound by default; on a small
# Lightsail disk that is an outage on a timer.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.7
    container_name: nego-lah-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    # ADR-0032: only ORIGIN_AUTH_SECRET, which the deploy copies out of the
    # backend's env file. Caddy has no use for the rest of it.
    env_file:
      - ./caddy.env
    mem_limit: 128m
    cpus: 0.4
    logging: *default-logging
    depends_on:
      - backend

  backend:
    # Image is built & pushed by CI; the server pulls it (never builds locally).
    # CI pins BACKEND_IMAGE_TAG to the commit SHA; a rollback is
    # `sudo env BACKEND_IMAGE_TAG=<previous sha> docker compose up -d backend`.
    image: ghcr.io/terryong31/nego-lah-backend:${BACKEND_IMAGE_TAG:-latest}
    build: ./backend
    container_name: nego-lah-backend
    restart: always
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
      # REDIS_URL deliberately NOT set here. Compose's `environment:` overrides
      # `env_file:`, so pinning it here would silently outrank whatever Infisical
      # exported into backend/.env. It comes from the env file: the managed
      # endpoint (Upstash, `rediss://`) is a secret change and a redeploy, not a
      # code change. redis-py reads the TLS scheme itself.
      # Pinned rather than inherited: the Dockerfile's fallback is 4, which put
      # four worker processes on a box with one or two cores. Matching the
      # worker count to the cores means less context-switching between workers
      # and more CPU left for Caddy sitting beside them.
      - WEB_CONCURRENCY=2
    # The API is the one process that legitimately needs room, so it takes the
    # memory Caddy doesn't and stays CPU-uncapped — a ceiling here would
    # idle capacity that nothing else is asking for.
    mem_limit: 1200m
    # Shutdown waits up to SHUTDOWN_TURN_GRACE_SECONDS (20 s) for in-flight
    # agent turns; Docker's default 10 s would SIGKILL them first.
    stop_grace_period: 30s
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:
